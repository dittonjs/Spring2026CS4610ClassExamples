<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>

    function fib(n) {
      if (n == 2 || n == 1) return n
      return fib(n-1) + fib(n-2)
    }

    WebAssembly.instantiateStreaming(fetch("program.wasm")).then((m) => {
      const {add, fib: fibWasm} = m.instance.exports
      let start = Date.now()
      let result = fib(45)
      let end = Date.now()
      document.getElementById("fibjs").innerText = `fib js: ${result} ${(end - start) / 1000}`

      start = Date.now()
      result = fibWasm(45)
      end = Date.now()
      document.getElementById("fibwasm").innerText = `fib wasm: ${result} ${(end - start) / 1000}`

    });
  </script>
</head>
<body>
  <div id="fibjs">fib js: </div>
  <div id="fibwasm">fib wasm: </div>
</body>
</html>
